<!-- Password Generator Static Site -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- import stylesheet -->
    <link rel="stylesheet" href="style.css">
    <title>Password Generator</title>
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        <form id="password-form">
            <div class="form-group">
                <label for="length">Password Length:</label>
                <input type="number" id="length" name="length" min="4" max="128" value="12" required>
            </div>
            
            <div class="form-group">
                <label>Include:</label>
                <div class="toggle-options">
                    <button type="button" class="toggle-btn active" data-option="uppercase">Uppercase</button>
                    <button type="button" class="toggle-btn active" data-option="numbers">Numbers</button>
                    <button type="button" class="toggle-btn active" data-option="special">Special</button>
                    <button type="button" class="toggle-btn active" data-option="lowercase">Lowercase</button>
                </div>
            </div>
            
            <button type="submit">Generate Password</button>
        </form>
        
        <h2>Your Generated Password:</h2>
        <div class="password-output">
            <div class="password-text" id="generated-password">Click "Generate Password" to create a secure password</div>
            <button type="button" id="copy-btn" onclick="copyPassword()" style="display: none;">Copy</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
